<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Каталог ігор — Level VR Club</title>
    <link href="styles.css" rel="stylesheet"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@100..900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="images/favicon.svg" type="/images/svg+xml">
    <style>
        /* ===== КАТАЛОГ ІГОР — ПОВНИЙ РЕДИЗАЙН ===== */

        * { box-sizing: border-box; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Noto Sans', sans-serif;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        /* Сітка фону */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        main {
            position: relative;
            z-index: 1;
            padding-top: 100px;
            padding-bottom: 80px;
        }

        /* ===== ЗАГОЛОВОК КАТАЛОГУ ===== */
        .catalog-hero {
            text-align: center;
            padding: 40px 20px 50px;
            position: relative;
        }

        .catalog-hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #00F0FF, transparent);
        }

        .catalog-eyebrow {
            font-size: 11px;
            letter-spacing: 6px;
            color: #00F0FF;
            text-transform: uppercase;
            margin-bottom: 16px;
            opacity: 0.7;
        }

        .catalog-title {
            font-size: clamp(36px, 8vw, 80px);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            line-height: 1;
            margin: 0 0 16px;
            /* Кіберпанк outline ефект */
            -webkit-text-stroke: 1px rgba(0,240,255,0.4);
            background: linear-gradient(135deg, #fff 40%, #00F0FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .catalog-count {
            font-size: 13px;
            color: #555;
            letter-spacing: 2px;
        }

        .catalog-count span {
            color: #00F0FF;
            font-weight: 700;
        }

        /* ===== ПАНЕЛЬ ФІЛЬТРІВ ===== */
        .filter-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            padding: 30px 20px;
            position: relative;
        }

        /* Пошук */
        .search-box {
            position: relative;
            flex: 1;
            max-width: 320px;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(0,240,255,0.2);
            color: #fff;
            padding: 12px 16px 12px 44px;
            font-family: 'Noto Sans', sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            outline: none;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: border-color 0.3s, background 0.3s;
        }

        .search-box input::placeholder { color: #444; }

        .search-box input:focus {
            border-color: #00F0FF;
            background: rgba(0,240,255,0.06);
        }

        .search-box svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.4;
            pointer-events: none;
        }

        /* Фільтри платформ */
        .platform-filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: #888;
            padding: 10px 18px;
            font-family: 'Noto Sans', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: rgba(0,240,255,0.4);
            color: #fff;
        }

        .filter-btn.active {
            background: rgba(0,240,255,0.1);
            border-color: #00F0FF;
            color: #00F0FF;
            box-shadow: 0 0 12px rgba(0,240,255,0.2);
        }

        /* ===== СІТКА ІГОР ===== */
        #games-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            padding: 20px 40px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ===== КАРТКА ГРИ ===== */
        .game-card {
            position: relative;
            background: #0a0a0a;
            border: 1px solid rgba(255,255,255,0.07);
            clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            animation: cardFadeIn 0.5s ease both;
        }

        .game-card:hover {
            transform: translateY(-6px);
            border-color: rgba(0,240,255,0.4);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 30px rgba(0,240,255,0.1);
        }

        /* Постер гри */
        .game-poster {
            position: relative;
            width: 100%;
            aspect-ratio: 3/4;
            overflow: hidden;
        }

        .game-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            display: block;
        }

        .game-card:hover .game-poster img {
            transform: scale(1.06);
        }

        /* Градієнт поверх постера */
        .game-poster::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                transparent 40%,
                rgba(0,0,0,0.3) 70%,
                rgba(0,0,0,0.95) 100%
            );
        }

        /* Бейдж платформи */
        .platform-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.85);
            border: 1px solid rgba(0,240,255,0.4);
            color: #00F0FF;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            padding: 4px 10px;
            text-transform: uppercase;
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
            z-index: 2;
        }

        /* Опис — ховер оверлей */
        .game-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,5,10,0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 3;
        }

        .game-card:hover .game-overlay {
            opacity: 1;
        }

        .game-overlay-text {
            font-size: 13px;
            line-height: 1.7;
            color: #ccc;
            text-align: center;
            display: -webkit-box;
            -webkit-line-clamp: 8;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Нижня частина картки */
        .game-info {
            padding: 16px 18px 18px;
            position: relative;
        }

        .game-info::before {
            content: '';
            position: absolute;
            top: 0;
            left: 18px;
            right: 18px;
            height: 1px;
            background: linear-gradient(90deg, #00F0FF, transparent);
            opacity: 0.3;
        }

        .game-title {
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 6px;
            color: #fff;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .game-platform-label {
            font-size: 11px;
            color: #444;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Номер картки — декор */
        .card-number {
            position: absolute;
            bottom: 16px;
            right: 16px;
            font-size: 11px;
            font-weight: 900;
            color: rgba(0,240,255,0.15);
            letter-spacing: 1px;
        }

        /* ===== СТАН — ЗАВАНТАЖЕННЯ ===== */
        .games-status {
            text-align: center;
            padding: 80px 20px;
            color: #555;
        }

        .games-status .status-icon {
            font-size: 48px;
            margin-bottom: 20px;
            display: block;
        }

        .games-status p {
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Loader dots */
        .loading-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00F0FF;
            border-radius: 50%;
            margin: 0 4px;
            animation: dotPulse 1.4s infinite;
        }

        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* ===== АНІМАЦІЯ КАРТОК ===== */
        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===== EMPTY STATE ===== */
        .empty-catalog {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            color: #333;
        }

        .empty-catalog::before {
            content: '◈';
            display: block;
            font-size: 48px;
            color: rgba(0,240,255,0.2);
            margin-bottom: 20px;
        }

        .empty-catalog p {
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* ===== МОБІЛЬНА ВЕРСІЯ ===== */
        @media (max-width: 768px) {
            main { padding-top: 80px; }

            .catalog-hero { padding: 30px 16px 40px; }

            #games-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
                padding: 16px;
            }

            .game-info { padding: 12px 14px 14px; }
            .game-title { font-size: 13px; }

            /* На мобільному overlay показуємо тапом */
            .game-overlay { display: none; }

            .filter-bar { padding: 20px 16px; gap: 10px; }
            .search-box { min-width: 100%; }
            .filter-btn { padding: 8px 14px; font-size: 11px; }
        }

        @media (max-width: 400px) {
            #games-container {
                grid-template-columns: 1fr;
            }
        }

        /* ===== КНОПКА "ПОКАЗАТИ ЩЕ" ===== */
        .load-more-wrap {
            display: flex;
            justify-content: center;
            padding: 10px 20px 50px;
        }

        .load-more-btn {
            background: rgba(0,240,255,0.06);
            border: 1px solid rgba(0,240,255,0.4);
            color: #00F0FF;
            padding: 14px 36px;
            font-family: 'Noto Sans', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: all 0.2s;
        }

        .load-more-btn:hover {
            background: rgba(0,240,255,0.15);
            box-shadow: 0 0 20px rgba(0,240,255,0.2);
        }

        /* ===== АДМІН: ДОДАВАННЯ ГРИ ЧЕРЕЗ САЙТ ===== */
        .admin-fab {
            position: fixed;
            right: 24px;
            bottom: 24px;
            width: 52px;
            height: 52px;
            background: rgba(0,0,0,0.85);
            border: 1px solid rgba(0,240,255,0.4);
            color: #00F0FF;
            font-size: 24px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 50;
            opacity: 0;
            transform: scale(0.7);
            transition: opacity 0.25s ease, transform 0.25s ease;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: all 0.2s;
        }

        .admin-fab:hover {
            box-shadow: 0 0 20px rgba(0,240,255,0.3);
        }

        .admin-fab.visible {
            display: flex;
            opacity: 1;
            transform: scale(1);
        }

        .admin-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px);
            display: none;
            align-items: flex-start;
            justify-content: center;
            z-index: 100;
            padding: 60px 16px;
            overflow-y: auto;
        }

        .admin-modal-overlay.open { display: flex; }

        .admin-modal {
            background: #0a0a0a;
            border: 1px solid rgba(0,240,255,0.3);
            width: 100%;
            max-width: 560px;
            padding: 28px;
            clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
        }

        .admin-modal h3 {
            margin: 0 0 20px;
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
        }

        .admin-field {
            margin-bottom: 14px;
        }

        .admin-field label {
            display: block;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 6px;
        }

        .admin-field input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 10px 14px;
            font-family: 'Noto Sans', sans-serif;
            font-size: 14px;
            outline: none;
        }

        .admin-field input:focus {
            border-color: #00F0FF;
        }

        .admin-row {
            display: flex;
            gap: 10px;
        }

        .admin-row .admin-field { flex: 1; }

        .admin-btn {
            background: rgba(0,240,255,0.1);
            border: 1px solid #00F0FF;
            color: #00F0FF;
            padding: 11px 20px;
            font-family: 'Noto Sans', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .admin-btn:hover { background: rgba(0,240,255,0.2); }
        .admin-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .admin-close {
            background: transparent;
            border: none;
            color: #666;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            float: right;
        }

        .admin-close:hover { color: #fff; }

        .admin-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .admin-tab {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: #666;
            padding: 10px 6px;
            font-family: 'Noto Sans', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
        }

        .admin-tab:hover { color: #ccc; }

        .admin-tab.active {
            color: #00F0FF;
            border-bottom-color: #00F0FF;
        }

        .admin-btn.danger {
            border-color: #ff5c5c;
            color: #ff5c5c;
            background: rgba(255,60,60,0.08);
        }

        .admin-btn.danger:hover { background: rgba(255,60,60,0.18); }

        .admin-results {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }

        .admin-result-card {
            display: flex;
            gap: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 10px;
        }

        .admin-result-card img {
            width: 54px;
            height: 72px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .admin-result-info {
            flex: 1;
            min-width: 0;
        }

        .admin-result-info .title {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .admin-result-info .plat {
            font-size: 11px;
            color: #00F0FF;
            margin-bottom: 6px;
        }

        .admin-result-actions {
            display: flex;
            align-items: center;
        }

        .admin-msg {
            margin-top: 14px;
            font-size: 12px;
            letter-spacing: 1px;
            padding: 10px 12px;
            display: none;
        }

        .admin-msg.show { display: block; }
        .admin-msg.ok { background: rgba(0,255,120,0.08); border: 1px solid rgba(0,255,120,0.3); color: #4dffb0; }
        .admin-msg.err { background: rgba(255,60,60,0.08); border: 1px solid rgba(255,60,60,0.3); color: #ff8080; }
        .admin-msg.exists { background: rgba(255,180,0,0.08); border: 1px solid rgba(255,180,0,0.3); color: #ffcf6b; }

        @media (max-width: 480px) {
            .admin-row { flex-direction: column; }
        }
    </style>
</head>

    <main>
        <!-- ЗАГОЛОВОК -->
        <div class="catalog-hero">
            <div class="catalog-eyebrow">// level vr club //</div>
            <h1 class="catalog-title">Каталог ігор</h1>
            <div class="catalog-count">Знайдено: <span id="games-total">0</span> ігор</div>
        </div>

        <!-- ФІЛЬТРИ -->
        <div class="filter-bar">
            <div class="search-box">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00F0FF" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>

                <input type="text" id="search-input" placeholder="Пошук гри..." autocomplete="off">

        <!-- КАРТКИ -->
        <div id="games-container">
            <div class="games-status">
                <div class="loading-dots">
                    <span></span><span></span><span></span>
                </div>

            </div>

        <!-- ПОКАЗАТИ ЩЕ -->
        <div class="load-more-wrap" id="load-more-wrap" style="display:none;">
            <button class="load-more-btn" id="load-more-btn">Показати ще</button>
        </div>
    </main>

    <!-- КНОПКА ДОДАВАННЯ ГРИ ЧЕРЕЗ САЙТ (без Telegram) -->
    <div class="admin-fab" id="admin-fab" title="Додати гру">+</div>

    <div class="admin-modal-overlay" id="admin-modal-overlay">
        <div class="admin-modal">
            <button class="admin-close" id="admin-close">Закрити ✕</button>
            <h3>Керування каталогом</h3>

            <div class="admin-field">
                <label>Ключ доступу</label>
                <input type="password" id="admin-key" placeholder="Секретний ключ адміністратора" autocomplete="off">
            </div>

            <div class="admin-tabs">
                <button class="admin-tab active" id="tab-add-btn">+ Додати гру</button>
                <button class="admin-tab" id="tab-delete-btn">🗑 Видалити гру</button>
            </div>

            <!-- ДОДАВАННЯ -->
            <div id="panel-add">
                <div class="admin-row">
                    <div class="admin-field">
                        <label>Назва гри</label>
                        <input type="text" id="admin-query" placeholder="Наприклад: UFC 5" autocomplete="off">
                    </div>
                    <button class="admin-btn" id="admin-search-btn" style="align-self:flex-end; margin-bottom:14px;">Знайти</button>
                </div>
                <div class="admin-results" id="admin-results"></div>
            </div>

            <!-- ВИДАЛЕННЯ -->
            <div id="panel-delete" style="display:none;">
                <div class="admin-field">
                    <label>Пошук у каталозі</label>
                    <input type="text" id="admin-delete-query" placeholder="Почніть вводити назву гри..." autocomplete="off">
                </div>
                <div class="admin-results" id="admin-delete-results"></div>
            </div>

            <div class="admin-msg" id="admin-msg"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <div id="particles-js"></div>
    <script>
        particlesJS.load('particles-js', 'particles.json', function() {});
    </script>
    <script src="script.js"></script>

    <script>
        let allGames = [];
        let currentPlatform = 'all';
        let currentSearch = '';

        const PAGE_SIZE = 10;
        let visibleCount = PAGE_SIZE;

        async function loadGames() {
            try {
                const response = await fetch('/api/games');
                allGames = await response.json();

                buildPlatformFilters();
                renderGames();
            } catch (error) {
                document.getElementById('games-container').innerHTML = `
                    <div class="games-status">
                        <span class="status-icon">✕</span>
                        <p>Помилка завантаження</p>
                    </div>`;
            }
        }

        function buildPlatformFilters() {
            const platforms = [...new Set(allGames.map(g => g.platform).filter(Boolean))];
            const bar = document.getElementById('platform-filters');

            platforms.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.platform = p;
                btn.textContent = p;
                btn.onclick = () => setFilter(p);
                bar.appendChild(btn);
            });

            bar.querySelectorAll('.filter-btn').forEach(btn => {
                btn.onclick = () => setFilter(btn.dataset.platform);
            });
        }

        function setFilter(platform) {
            currentPlatform = platform;
            visibleCount = PAGE_SIZE;
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.platform === platform);
            });
            renderGames();
        }

        function renderGames() {
            const container = document.getElementById('games-container');
            const totalEl = document.getElementById('games-total');

            let filtered = allGames;

            if (currentPlatform !== 'all') {
                filtered = filtered.filter(g => g.platform === currentPlatform);
            }

            if (currentSearch) {
                filtered = filtered.filter(g =>
                    g.title.toLowerCase().includes(currentSearch) ||
                    (g.description || '').toLowerCase().includes(currentSearch)
                );
            }

            totalEl.textContent = filtered.length;

            const loadMoreWrap = document.getElementById('load-more-wrap');

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-catalog">
                        <p>Нічого не знайдено</p>
                    </div>`;
                loadMoreWrap.style.display = 'none';
                return;
            }

            const visible = filtered.slice(0, visibleCount);

            container.innerHTML = visible.map((game, i) => `
                <div class="game-card" style="animation-delay:${i * 0.06}s">
                    <div class="game-poster">
                        <img
                            src="${game.image_url || 'images/placeholder.jpg'}"
                            alt="${game.title}"
                            loading="lazy"
                            onerror="this.src='images/placeholder.jpg'"
                        >
                        <div class="platform-badge">${game.platform || '—'}</div>
                        <div class="game-overlay">
                            <p class="game-overlay-text">${game.description || 'Професійна гра для гравців усіх рівнів.'}</p>
                        </div>
                    </div>
                    <div class="game-info">
                        <h2 class="game-title">${game.title}</h2>
                        <div class="game-platform-label">${game.platform || ''}</div>
                        <div class="card-number">#${String(i + 1).padStart(2, '0')}</div>
                    </div>
                </div>
            `).join('');

            if (filtered.length > visibleCount) {
                loadMoreWrap.style.display = 'flex';
            } else {
                loadMoreWrap.style.display = 'none';
            }
        }

        document.getElementById('load-more-btn').addEventListener('click', () => {
            visibleCount += PAGE_SIZE;
            renderGames();
        });

        // Пошук з debounce
        let searchTimer;
        document.getElementById('search-input').addEventListener('input', e => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                currentSearch = e.target.value.toLowerCase().trim();
                visibleCount = PAGE_SIZE;
                renderGames();
            }, 300);
        });

        /* ================= ДОДАВАННЯ ГРИ ЧЕРЕЗ САЙТ (без Telegram) ================= */
        const adminFab = document.getElementById('admin-fab');
        const adminOverlay = document.getElementById('admin-modal-overlay');
        const adminClose = document.getElementById('admin-close');
        const adminKeyInput = document.getElementById('admin-key');
        const adminQueryInput = document.getElementById('admin-query');
        const adminSearchBtn = document.getElementById('admin-search-btn');
        const adminResults = document.getElementById('admin-results');
        const adminMsg = document.getElementById('admin-msg');

        // Зберігаємо ключ у sessionStorage, щоб не вводити щоразу в межах сесії
        adminKeyInput.value = sessionStorage.getItem('lvr_admin_key') || '';

        // === СЕКРЕТНЕ ВІДКРИТТЯ ПАНЕЛІ АДМІНА ===
        // Десктоп: комбінація клавіш Ctrl + Shift + A
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'a') {
                e.preventDefault();
                adminFab.classList.toggle('visible');
            }
        });

        // Мобільний: 5 швидких тапів по логотипу зверху
        (function setupSecretTap() {
            const logo = document.querySelector('.logo');
            if (!logo) return;
            const href = logo.getAttribute('href');
            let taps = 0;
            let tapTimer = null;

            logo.addEventListener('click', (e) => {
                e.preventDefault();
                taps++;

                if (taps >= 5) {
                    clearTimeout(tapTimer);
                    taps = 0;
                    adminFab.classList.add('visible');
                    return;
                }

                clearTimeout(tapTimer);
                tapTimer = setTimeout(() => {
                    if (taps > 0 && taps < 5 && href) {
                        window.location.href = href;
                    }
                    taps = 0;
                }, 400);
            });
        })();

        adminFab.addEventListener('click', () => {
            adminOverlay.classList.add('open');
        });
        adminClose.addEventListener('click', () => {
            adminOverlay.classList.remove('open');
        });
        adminOverlay.addEventListener('click', (e) => {
            if (e.target === adminOverlay) adminOverlay.classList.remove('open');
        });

        function showAdminMsg(text, type) {
            adminMsg.textContent = text;
            adminMsg.className = `admin-msg show ${type}`;
        }

        async function searchGamesFromSite() {
            const key = adminKeyInput.value.trim();
            const query = adminQueryInput.value.trim();

            adminMsg.className = 'admin-msg';
            adminResults.innerHTML = '';

            if (!key) return showAdminMsg('Введіть ключ доступу', 'err');
            if (!query) return showAdminMsg('Введіть назву гри', 'err');

            sessionStorage.setItem('lvr_admin_key', key);

            adminSearchBtn.disabled = true;
            adminSearchBtn.textContent = 'Пошук...';

            try {
                const res = await fetch('/api/games/search-site', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key, query })
                });
                const data = await res.json();

                if (!res.ok) {
                    return showAdminMsg(data.error || 'Помилка пошуку', 'err');
                }

                if (!data.length) {
                    return showAdminMsg('Нічого не знайдено', 'err');
                }

                adminResults.innerHTML = data.map((g, i) => `
                    <div class="admin-result-card" data-index="${i}">
                        <img src="${g.image_url}" alt="${g.title}">
                        <div class="admin-result-info">
                            <div class="title">${g.title}</div>
                            <div class="plat">${g.platform} · ${g.platformsFull || ''}</div>
                        </div>
                        <div class="admin-result-actions">
                            ${g.exists
                                ? `<span style="font-size:11px; color:#ffcf6b; letter-spacing:1px;">Вже є</span>`
                                : `<button class="admin-btn" data-add="${i}">Додати</button>`
                            }
                        </div>
                    </div>
                `).join('');

                adminResults.querySelectorAll('[data-add]').forEach(btn => {
                    btn.addEventListener('click', () => addGameFromSite(data[Number(btn.dataset.add)], btn));
                });
            } catch (err) {
                showAdminMsg('Помилка з\'єднання із сервером', 'err');
            } finally {
                adminSearchBtn.disabled = false;
                adminSearchBtn.textContent = 'Знайти';
            }
        }

        async function addGameFromSite(game, btnEl) {
            const key = adminKeyInput.value.trim();
            btnEl.disabled = true;
            btnEl.textContent = 'Додаємо...';

            try {
                const res = await fetch('/api/games/add-site', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key, game })
                });
                const data = await res.json();

                if (res.status === 409) {
                    showAdminMsg(`«${game.title}» вже є в каталозі — пропущено, дублікат не додано.`, 'exists');
                    btnEl.textContent = 'Вже є';
                    return;
                }

                if (!res.ok) {
                    showAdminMsg(data.error || 'Помилка додавання', 'err');
                    btnEl.disabled = false;
                    btnEl.textContent = 'Додати';
                    return;
                }

                allGames.unshift(data.game);
                buildPlatformFiltersIfNeeded(data.game.platform);
                renderGames();
                showAdminMsg(`«${game.title}» успішно додано на сайт!`, 'ok');
                btnEl.textContent = 'Додано ✓';
            } catch (err) {
                showAdminMsg('Помилка з\'єднання із сервером', 'err');
                btnEl.disabled = false;
                btnEl.textContent = 'Додати';
            }
        }

        function buildPlatformFiltersIfNeeded(platform) {
            const bar = document.getElementById('platform-filters');
            const exists = [...bar.querySelectorAll('.filter-btn')].some(b => b.dataset.platform === platform);
            if (platform && !exists) {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.platform = platform;
                btn.textContent = platform;
                btn.onclick = () => setFilter(platform);
                bar.appendChild(btn);
            }
        }

        adminSearchBtn.addEventListener('click', searchGamesFromSite);
        adminQueryInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') searchGamesFromSite();
        });

        /* ===== ВКЛАДКИ: ДОДАТИ / ВИДАЛИТИ ===== */
        const tabAddBtn = document.getElementById('tab-add-btn');
        const tabDeleteBtn = document.getElementById('tab-delete-btn');
        const panelAdd = document.getElementById('panel-add');
        const panelDelete = document.getElementById('panel-delete');
        const deleteQueryInput = document.getElementById('admin-delete-query');
        const deleteResults = document.getElementById('admin-delete-results');

        tabAddBtn.addEventListener('click', () => {
            tabAddBtn.classList.add('active');
            tabDeleteBtn.classList.remove('active');
            panelAdd.style.display = 'block';
            panelDelete.style.display = 'none';
            adminMsg.className = 'admin-msg';
        });

        tabDeleteBtn.addEventListener('click', () => {
            tabDeleteBtn.classList.add('active');
            tabAddBtn.classList.remove('active');
            panelDelete.style.display = 'block';
            panelAdd.style.display = 'none';
            adminMsg.className = 'admin-msg';
            renderDeleteResults();
        });

        function renderDeleteResults() {
            const q = deleteQueryInput.value.toLowerCase().trim();
            const matches = (q
                ? allGames.filter(g => g.title.toLowerCase().includes(q))
                : allGames
            ).slice(0, 30);

            if (!matches.length) {
                deleteResults.innerHTML = `<p style="color:#555; font-size:13px;">Нічого не знайдено в каталозі.</p>`;
                return;
            }

            deleteResults.innerHTML = matches.map(g => `
                <div class="admin-result-card" data-id="${g.id}">
                    <img src="${g.image_url || 'images/placeholder.jpg'}" alt="${g.title}" onerror="this.src='images/placeholder.jpg'">
                    <div class="admin-result-info">
                        <div class="title">${g.title}</div>
                        <div class="plat">${g.platform || ''}</div>
                    </div>
                    <div class="admin-result-actions">
                        <button class="admin-btn danger" data-delete-id="${g.id}">Видалити</button>
                    </div>
                </div>
            `).join('');

            deleteResults.querySelectorAll('[data-delete-id]').forEach(btn => {
                btn.addEventListener('click', () => deleteGameFromSite(Number(btn.dataset.deleteId), btn));
            });
        }

        deleteQueryInput.addEventListener('input', renderDeleteResults);

        async function deleteGameFromSite(id, btnEl) {
            const key = adminKeyInput.value.trim();
            if (!key) return showAdminMsg('Введіть ключ доступу', 'err');

            const game = allGames.find(g => g.id === id);
            const title = game ? game.title : `#${id}`;

            if (!confirm(`Видалити «${title}» з каталогу? Дію не можна скасувати.`)) return;

            btnEl.disabled = true;
            btnEl.textContent = 'Видаляємо...';

            try {
                const res = await fetch('/api/games/delete-site', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key, id })
                });
                const data = await res.json();

                if (!res.ok) {
                    showAdminMsg(data.error || 'Помилка видалення', 'err');
                    btnEl.disabled = false;
                    btnEl.textContent = 'Видалити';
                    return;
                }

                allGames = allGames.filter(g => g.id !== id);
                renderGames();
                renderDeleteResults();
                showAdminMsg(`«${title}» видалено з каталогу.`, 'ok');
            } catch (err) {
                showAdminMsg('Помилка з\'єднання із сервером', 'err');
                btnEl.disabled = false;
                btnEl.textContent = 'Видалити';
            }
        }

        window.onload = loadGames;
    </script>
